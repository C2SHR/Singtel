<script>
// Dynamic loader - tries multiple CDN sources for SharePoint compatibility
(function(){
  var libs = [
    { name:'XLSX',    urls:['https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'] },
    { name:'Chart',   urls:['https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js','https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js'] },
    { name:'pdfjsLib',urls:['https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'] },
  ];
  window._libsLoaded = 0;
  window._libsNeeded = libs.length;
  function tryLoad(lib, idx) {
    if (idx >= lib.urls.length) { console.warn('All CDN sources failed for', lib.name); window._libsLoaded++; checkReady(); return; }
    var s = document.createElement('script');
    s.src = lib.urls[idx];
    s.onload = function(){ window._libsLoaded++; checkReady(); };
    s.onerror = function(){ tryLoad(lib, idx+1); };
    document.head.appendChild(s);
  }
  function checkReady(){
    if(window._libsLoaded >= window._libsNeeded){
      if(typeof pdfjsLib !== 'undefined') pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      if(typeof renderUpload === 'function') renderUpload();
    }
  }
  libs.forEach(function(lib){ tryLoad(lib, 0); });
})();

// ── Parse Staff Master (Excel/CSV) ──
function parseStaff(buf) {
  const wb = XLSX.read(buf, { type: 'array' });
  const sn = wb.SheetNames;
  const target = sn.find(n => /staff|master|listing|telephone|directory/i.test(n)) || sn[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[target], { defval: '' });
  if (!rows.length) return [];
  const k = Object.keys(rows[0]);
  const numKey   = k.find(c => /phone|number|tel|mobile|line|ext/i.test(c)) || k[0];
  const nameKey  = k.find(c => /name|staff|person|employee/i.test(c)) || k[1];
  const deptKey  = k.find(c => /dept|department|division|team/i.test(c));
  const mgrKey   = k.find(c => /manager|mgr|supervisor/i.test(c));
  const locKey   = k.find(c => /location|loc|country|office/i.test(c));
  const statusKey= k.find(c => /status|active|resigned/i.test(c));
  return rows.map(r => ({
    num:    String(r[numKey] || '').replace(/\D/g, '').replace(/^65/, '').slice(-8),
    name:   r[nameKey] || '',
    dept:   r[deptKey] || '',
    mgr:    r[mgrKey] || '',
    loc:    r[locKey] || '',
    status: String(r[statusKey] || 'Active')
  })).filter(r => r.num.length >= 7);
}

// ── PDF to text ──
async function pdfToText(buf) {
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  let t = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const c = await pg.getTextContent();
    t += c.items.map(s => s.str).join(' ') + '\n';
  }
  return t;
}

// ── Parse Singtel PDF bill ──
function parseBillText(text) {
  const lines = text.split('\n');
  const phoneRe = /\b([689]\d{7})\b/;
  const amtRe   = /\$?\s*([\d,]+\.\d{2})/g;
  let billMonth = '';
  const mo2 = text.match(/\b(January|February|March|April|May|June|July|August|September|October|November|December)\s+(20\d\d)\b/i);
  if (mo2) billMonth = mo2[1] + ' ' + mo2[2];
  if (!billMonth) { const m = text.match(/bill(?:ing)?\s*(?:period|month)[^\n]*?([A-Za-z]+\s*\d{4})/i); if (m) billMonth = m[1]; }
  let totalBill = 0;
  const tM = text.match(/(?:total\s+(?:amount\s+)?due|amount\s+payable|grand\s+total)[^\d]*(\d[\d,]*\.\d{2})/i);
  if (tM) totalBill = parseFloat(tM[1].replace(/,/g, ''));
  const lineCharges = {};
  lines.forEach(line => {
    const pm = line.match(phoneRe); if (!pm) return;
    const num = pm[1]; const amounts = [...line.matchAll(amtRe)]; if (!amounts.length) return;
    const amt = parseFloat(amounts[amounts.length - 1][1].replace(/,/g, ''));
    if (amt <= 0 || amt > 5000) return;
    if (!lineCharges[num]) lineCharges[num] = { num, total: 0, count: 0 };
    lineCharges[num].total += amt; lineCharges[num].count++;
  });
  const iddRows = [];
  const iS = text.match(/(?:idd|international\s+direct|overseas\s+call)([\s\S]{0,3000}?)(?:subtotal|total\s+amount|roaming|local\s+call)/i);
  if (iS) iS[1].split('\n').forEach(line => {
    const pm = line.match(phoneRe); const amounts = [...line.matchAll(amtRe)];
    if (pm && amounts.length) { const amt = parseFloat(amounts[amounts.length - 1][1].replace(/,/g, '')); if (amt > 0) iddRows.push({ num: pm[1], amount: amt, country: '' }); }
  });
  let iddTotal = iddRows.reduce((s, r) => s + r.amount, 0);
  if (!iddTotal) { const im = text.match(/(?:idd|international)[^\d\n]*(\d[\d,]*\.\d{2})/i); if (im) iddTotal = parseFloat(im[1].replace(/,/g, '')); }
  if (!totalBill) totalBill = Object.values(lineCharges).reduce((s, r) => s + r.total, 0);
  return { billMonth, totalBill, lineCharges, iddRows, iddTotal };
}

// ── Parse CSV bill ──
function parseCSVBill(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return { billMonth: '', totalBill: 0, lineCharges: {}, iddRows: [], iddTotal: 0 };
  const delim = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(delim).map(h => h.replace(/"/g, '').trim());
  const rows = lines.slice(1).map(line => {
    const cells = line.split(delim).map(c => c.replace(/"/g, '').trim());
    const o = {}; headers.forEach((h, i) => o[h] = cells[i] || ''); return o;
  });
  const k = Object.keys(rows[0] || {});
  const numKey  = k.find(c => /phone|number|tel|mobile|line/i.test(c));
  const amtKey  = k.find(c => /amount|total|charge|cost/i.test(c));
  const typeKey = k.find(c => /type|desc|category/i.test(c));
  const moKey   = k.find(c => /month|period|date/i.test(c));
  const lc = {}, iddRows = []; let billMonth = '', totalBill = 0;
  rows.forEach(r => {
    const num = String(r[numKey] || '').replace(/\D/g, '').slice(-8);
    const amt = parseFloat(String(r[amtKey] || '0').replace(/[^0-9.]/g, '')) || 0;
    const type = String(r[typeKey] || '').toLowerCase();
    if (!billMonth && r[moKey]) billMonth = r[moKey];
    totalBill += amt;
    if (num.length >= 7) {
      if (!lc[num]) lc[num] = { num, total: 0, count: 0 };
      lc[num].total += amt; lc[num].count++;
      if (/idd|international|overseas/i.test(type)) iddRows.push({ num, amount: amt, country: '' });
    }
  });
  return { billMonth, totalBill, lineCharges: lc, iddRows, iddTotal: iddRows.reduce((s, r) => s + r.amount, 0) };
}

// ── Analyse & match ──
function analyse(staffRows, billData) {
  const staffMap = {};
  staffRows.forEach(s => { if (s.num) staffMap[s.num] = s; });
  const month = billData.billMonth || 'Current month';
  const enriched = Object.values(billData.lineCharges).map(lc => {
    const st = staffMap[lc.num] || null;
    return { ...lc, name: st?.name || '', dept: st?.dept || '', mgr: st?.mgr || '', loc: st?.loc || '', matched: !!st };
  });
  const iddEnriched = billData.iddRows.map(r => {
    const st = staffMap[r.num] || null;
    return { ...r, name: st?.name || '', dept: st?.dept || '', mgr: st?.mgr || '' };
  });
  const unmatched = enriched.filter(r => !r.matched);
  const hrAlerts = [];
  iddEnriched.filter(r => r.amount > 50).forEach(r => hrAlerts.push({ num: r.num, name: r.name || r.num, dept: r.dept, iddTotal: r.amount, countries: r.country || '—', latest: month, status: 'High IDD – verify', level: 'red' }));
  iddEnriched.filter(r => r.amount > 0 && r.amount <= 50).forEach(r => hrAlerts.push({ num: r.num, name: r.name || r.num, dept: r.dept, iddTotal: r.amount, countries: r.country || '—', latest: month, status: 'Monitor', level: 'amber' }));
  if (unmatched.length) hrAlerts.push({ num: '—', name: `${unmatched.length} unmatched line(s)`, dept: '—', iddTotal: 0, countries: '—', latest: month, status: 'Not in Staff Master', level: 'navy' });
  if (!hrAlerts.length) hrAlerts.push({ num: '—', name: 'No alerts', dept: 'All clear', iddTotal: 0, countries: '—', latest: month, status: 'All lines matched, no high IDD', level: 'green' });
  const prevSummary = S.prevData?.summary || [];
  const monthlySummary = [...prevSummary, { month, total: billData.totalBill, sub: billData.totalBill - billData.iddTotal, idd: billData.iddTotal, credits: 0, gst: 0, lines: Object.keys(billData.lineCharges).length, notes: '' }];
  return {
    month, enriched, iddEnriched, unmatched, hrAlerts,
    totalBill: billData.totalBill, iddTotal: billData.iddTotal,
    activeLines: staffRows.filter(s => /active/i.test(s.status) || !s.status).length,
    unmatchedCount: unmatched.length,
    monthlySummary,
    billingRows: enriched.map(r => ({ month, num: r.num, name: r.name, sub: r.total - 0, idd: 0, other: 0, total: r.total, country: '', note: '' })),
    iddRows: iddEnriched.map(r => ({ month, num: r.num, name: r.name, dept: r.dept, mgr: r.mgr, country: r.country || '', idd: r.amount, sub: 12, total: r.amount + 12, flag: r.amount > 50 ? 'High IDD' : '' })),
    crossRef: enriched.sort((a,b) => b.total - a.total).map(r => ({ num: r.num, name: r.name, dept: r.dept, loc: r.loc, status: r.matched ? 'Hire' : 'Pending', may: r.total, total: r.total, iddTotal: 0, countries: '', flag: r.matched ? 'OK' : 'Pending' }))
  };
}

window.handleNewBill = async function(e) {
  const file = e.target.files[0]; if (!file || !S.files.staff) return;
  if (S.result?.monthlySummary) S.prevData = { summary: S.result.monthlySummary };
  app.innerHTML = `<div class="spinner"><div class="spin"></div><div style="font-size:13px;color:#64748b">Reading ${file.name}…</div></div>`;
  try {
    const buf = await file.arrayBuffer();
    const bd = file.name.toLowerCase().endsWith('.csv') ? parseCSVBill(new TextDecoder().decode(buf)) : parseBillText(await pdfToText(buf));
    renderDash(analyse(S.files.staff, bd), true);
  } catch(err) { showErr(err.message); }
};

// ── Process both files ──
async function processFiles() {
  app.innerHTML = `<div class="spinner"><div class="spin"></div><div style="font-size:13px;color:#64748b">Matching staff to bill…</div></div>`;
  try {
    const [sb, bb] = await Promise.all([S.files.staffRaw.arrayBuffer(), S.files.billRaw.arrayBuffer()]);
    const staffRows = parseStaff(new Uint8Array(sb));
    S.files.staff = staffRows;
    const bd = S.files.billRaw.name.toLowerCase().endsWith('.csv') ? parseCSVBill(new TextDecoder().decode(bb)) : parseBillText(await pdfToText(new Uint8Array(bb)));
    renderDash(analyse(staffRows, bd), true);
  } catch(err) { showErr(err.message); }
}

function showErr(msg) {
  app.innerHTML = `<div class="spinner"><div style="font-size:28px;color:#dc2626">&#9888;</div><div style="font-size:13px;color:#64748b;max-width:400px;text-align:center">${msg||'Could not read files.'}</div><button onclick="renderUpload()" style="padding:8px 20px;background:#193e6b;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit">Try again</button></div>`;
}

// ── Upload screen ──
function renderUpload() {
  S = { tab: 'dashboard', result: null, prevData: null, files: { staffRaw: null, billRaw: null, staff: null } };
  app.innerHTML = `
  <div class="upload-screen">
    <div class="upload-gold-bar"></div>
    <div class="upload-logo"><div class="logo-box"><span class="logo-text">CLaa<b>S2</b>SaaS &nbsp;·&nbsp; Singtel Dashboard</span></div></div>
    <div class="upload-heading">
      <h2>Upload your files to generate the dashboard</h2>
      <p>Two files needed — Staff Telephone Listing and this month's Singtel bill</p>
    </div>
    <div class="upload-grid">
      <label for="f-staff"><div class="upload-box" id="box-staff">
        <input type="file" id="f-staff" accept=".xlsx,.xls,.csv" onchange="onFile(event,'staff')">
        <span class="ub-icon navy">${ico.book}</span>
        <div class="ub-title">Staff Master Telephone Listing</div>
        <div class="ub-sub">Excel (.xlsx) or CSV<br>Names &nbsp;·&nbsp; Departments &nbsp;·&nbsp; Managers &nbsp;·&nbsp; Phone numbers</div>
        <div class="ub-done" id="staff-done"></div>
      </div></label>
      <label for="f-bill"><div class="upload-box" id="box-bill">
        <input type="file" id="f-bill" accept=".pdf,.csv" onchange="onFile(event,'bill')">
        <span class="ub-icon gold">${ico.invoice}</span>
        <div class="ub-title">Singtel Monthly Bill</div>
        <div class="ub-sub">PDF or CSV<br>Charges &nbsp;·&nbsp; IDD &nbsp;·&nbsp; Line items extracted automatically</div>
        <div class="ub-done" id="bill-done"></div>
      </div></label>
    </div>
    <button class="btn-go" id="btn-go" onclick="processFiles()">${ico.chart}&nbsp; Generate dashboard</button>
    <p class="upload-note">${ico.lock}&nbsp; Files processed entirely in your browser — nothing is sent to any server</p>
  </div>`;
  ['staff','bill'].forEach(type => {
    const box = document.getElementById('box-' + type);
    box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drag'); });
    box.addEventListener('dragleave', () => box.classList.remove('drag'));
    box.addEventListener('drop', e => { e.preventDefault(); box.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) markFile(f, type); });
  });
}

window.onFile = function(e, type) { const f = e.target.files[0]; if (f) markFile(f, type); };

function markFile(f, type) {
  if (type === 'staff') S.files.staffRaw = f; else S.files.billRaw = f;
  document.getElementById('box-' + type).classList.add('done');
  document.getElementById(type + '-done').textContent = '✓ ' + f.name;
  if (S.files.staffRaw && S.files.billRaw) document.getElementById('btn-go').classList.add('ready');
}

// renderUpload called by dynamic loader
</script>
</body>
</html>
