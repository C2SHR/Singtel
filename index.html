<script>
// Dynamic loader - tries multiple CDN sources for SharePoint compatibility
(function(){
  var libs = [
    { name:'XLSX',    urls:['https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'] },
    { name:'Chart',   urls:['https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js','https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js'] },
    { name:'pdfjsLib',urls:['https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'] },
  ];
  window._libsLoaded = 0;
  window._libsNeeded = libs.length;
  function tryLoad(lib, idx) {
    if (idx >= lib.urls.length) { console.warn('All CDN sources failed for', lib.name); window._libsLoaded++; checkReady(); return; }
    var s = document.createElement('script');
    s.src = lib.urls[idx];
    s.onload = function(){ window._libsLoaded++; checkReady(); };
    s.onerror = function(){ tryLoad(lib, idx+1); };
    document.head.appendChild(s);
  }
  function checkReady(){
    if(window._libsLoaded >= window._libsNeeded){
      if(typeof pdfjsLib !== 'undefined') pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
      if(typeof renderUpload === 'function') renderUpload();
    }
  }
  libs.forEach(function(lib){ tryLoad(lib, 0); });
})();

// ── Parse Staff Master (Excel/CSV) ──
function parseStaff(buf) {
  const wb = XLSX.read(buf, { type: 'array' });
  const sn = wb.SheetNames;
  const target = sn.find(n => /staff|master|listing|telephone|directory/i.test(n)) || sn[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[target], { defval: '' });
  if (!rows.length) return [];
  const k = Object.keys(rows[0]);
  const numKey   = k.find(c => /phone|number|tel|mobile|line|ext/i.test(c)) || k[0];
  const nameKey  = k.find(c => /name|staff|person|employee/i.test(c)) || k[1];
  const deptKey  = k.find(c => /dept|department|division|team/i.test(c));
  const mgrKey   = k.find(c => /manager|mgr|supervisor/i.test(c));
  const locKey   = k.find(c => /location|loc|country|office/i.test(c));
  const statusKey= k.find(c => /status|active|resigned/i.test(c));
  return rows.map(r => ({
    num:    String(r[numKey] || '').replace(/\D/g, '').replace(/^65/, '').slice(-8),
    name:   r[nameKey] || '',
    dept:   r[deptKey] || '',
    mgr:    r[mgrKey] || '',
    loc:    r[locKey] || '',
    status: String(r[statusKey] || 'Active')
  })).filter(r => r.num.length >= 7);
}

// ── PDF to text ──
async function pdfToText(buf) {
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  let t = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const pg = await pdf.getPage(i);
    const c = await pg.getTextContent();
    t += c.items.map(s => s.str).join(' ') + '\n';
  }
  return t;
}

// ── Parse Singtel PDF bill ──
function parseBillText(text) {
  // ── DEBUG: log first 2000 chars to console so we can see what PDF.js extracted ──
  console.log('=== PDF TEXT SAMPLE ===');
  console.log(text.slice(0, 3000));
  console.log('=== IDD SEARCH ===');
  const iddIdx = text.indexOf('IDD');
  if (iddIdx > -1) console.log('IDD found at:', iddIdx, text.slice(iddIdx, iddIdx+200));
  const bizIdx = text.indexOf('BIZVOICE');
  if (bizIdx > -1) console.log('BIZVOICE found at:', bizIdx, text.slice(bizIdx, bizIdx+200));
  console.log('=== END DEBUG ===');
  const moNames = {jan:'January',feb:'February',mar:'March',apr:'April',may:'May',jun:'June',
    jul:'July',aug:'August',sep:'September',oct:'October',nov:'November',dec:'December'};
  const moShort = {jan:'Jan',feb:'Feb',mar:'Mar',apr:'Apr',may:'May',jun:'Jun',
    jul:'Jul',aug:'Aug',sep:'Sep',oct:'Oct',nov:'Nov',dec:'Dec'};

  // ── Bill month detection — multiple patterns ──
  let billMonth = '';
  // Pattern 1: "Bill Date 19 Feb 2026" (all on one line after PDF extraction)
  const bd1 = text.match(/Bill\s*Date\s+(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(\d{4})/i);
  if (bd1) billMonth = moShort[bd1[2].toLowerCase().slice(0,3)] + '-' + bd1[3].slice(2);
  // Pattern 2: "17 Mar 2026" standalone (PDF sometimes splits lines)
  if (!billMonth) {
    const bd2 = text.match(/\b(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(20\d{2})\b/i);
    if (bd2) billMonth = moShort[bd2[2].toLowerCase().slice(0,3)] + '-' + bd2[3].slice(2);
  }
  // Pattern 3: from filename hint already applied upstream — leave empty for upstream to fill
  // Pattern 4: from subscription charge period e.g. "12 Mar 2026 to 11 Apr 2026"
  if (!billMonth) {
    const bd3 = text.match(/12\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\s+(20\d{2})\s+to/i);
    if (bd3) {
      // subscription period "12 Mar 2026 to 11 Apr 2026" means it's the Apr bill
      const moIdx = Object.keys(moShort).indexOf(bd3[1].toLowerCase().slice(0,3));
      const nextMo = moIdx >= 0 ? Object.values(moShort)[moIdx] : bd3[1].slice(0,3);
      billMonth = nextMo + '-' + bd3[2].slice(2);
    }
  }

  // ── Total bill amount ──
  let totalBill = 0;
  // "Total Current Charges 981.12" (last page)
  const tc = text.match(/Total\s+Current\s+Charges\s+([\d,]+\.\d{2})/i);
  if (tc) totalBill = parseFloat(tc[1].replace(/,/g,''));
  // Fallback: "Total Due (SGD) 981.12"
  if (!totalBill) {
    const td = text.match(/Total\s+Due\s*(?:\(SGD\))?\s*([\d,]+\.\d{2})/i);
    if (td) totalBill = parseFloat(td[1].replace(/,/g,''));
  }

  // ── GST ──
  const gstM = text.match(/Current\s+Taxable\s+Charges[^\n]*@\s*9\s*%\s+([\d,]+\.\d{2})/i);
  const gst = gstM ? parseFloat(gstM[1].replace(/,/g,'')) : 0;

  // ── Per-line charges & IDD ──
  // Parse each BIZVOICE/TELEPHONE block
  const lineCharges = {};
  const iddRows = [];

  // Regex to capture each number block
  const blockRe = /(?:BIZVOICE|TELEPHONE)\s+NO\.\s+(\d{8})\s*([\s\S]*?)(?=(?:BIZVOICE|TELEPHONE)\s+NO\.\s+\d{8}|^\s*GST\s*$|Total Current Charges|Total\s+\d{2,3}\.\d{2}\s*$)/gm;
  let bm;
  while ((bm = blockRe.exec(text)) !== null) {
    const num = bm[1];
    const block = bm[2];

    // Block total = last standalone "Total X.XX" line
    const allTotals = [...block.matchAll(/^\s*Total\s+([\d,]+\.\d{2})\s*$/gm)];
    if (!allTotals.length) {
      // try inline total
      const inlineTot = [...block.matchAll(/\bTotal\s+([\d,]+\.\d{2})/g)];
      if (!inlineTot.length) continue;
      const amt = parseFloat(inlineTot[inlineTot.length-1][1].replace(/,/g,''));
      if (amt > 0 && amt < 2000) {
        if (!lineCharges[num]) lineCharges[num] = {num,total:0,count:0};
        lineCharges[num].total += amt; lineCharges[num].count++;
      }
      continue;
    }
    const lineTotal = parseFloat(allTotals[allTotals.length-1][1].replace(/,/g,''));
    if (lineTotal <= 0 || lineTotal > 2000) continue;
    if (!lineCharges[num]) lineCharges[num] = {num,total:0,count:0};
    lineCharges[num].total += lineTotal; lineCharges[num].count++;

    // IDD detection in this block
    if (/IDD\s*001\s*Call/i.test(block)) {
      // "Total for IDD 001 Call\n51.96" OR "Total for IDD 001 Call 51.96"
      const iddM = block.match(/Total\s+for\s+IDD\s*001\s*Call\s*\n?\s*([\d,]+\.\d{2})/i);
      const iddAmt = iddM ? parseFloat(iddM[1].replace(/,/g,'')) : 0;
      // Get primary country
      const ctryM = block.match(/\b(Philippines|Malaysia|India|Indonesia|China|Australia|USA|United\s*States|New\s*Zealand|UK|Singapore)\b/i);
      const country = ctryM ? ctryM[1] : '';
      if (iddAmt > 0) iddRows.push({num, amount:iddAmt, country});
      else {
        // Fallback: sum individual IDD call amounts
        const iddLines = [...block.matchAll(/\b(Philippines|Malaysia|India|Indonesia|China|Australia|USA|New Zealand)\b[^\n]*([\d]+\.\d{2})/gi)];
        if (iddLines.length) {
          const sumAmt = iddLines.reduce((s,m)=>s+parseFloat(m[2]),0);
          if (sumAmt>0) iddRows.push({num,amount:sumAmt,country:iddLines[0][1]});
        }
      }
    }
  }

  // ── Fallback if block regex captured nothing ──
  if (!Object.keys(lineCharges).length) {
    // Try simpler: find all "BIZVOICE NO. XXXXXXXX" followed eventually by "Total X.XX"
    const simple = text.split(/(?=BIZVOICE NO\.|TELEPHONE NO\.)/);
    simple.forEach(chunk => {
      const nm = chunk.match(/(?:BIZVOICE|TELEPHONE)\s+NO\.\s+(\d{8})/);
      if (!nm) return;
      const num = nm[1];
      const tots = [...chunk.matchAll(/\bTotal\s+([\d,]+\.\d{2})/g)];
      if (!tots.length) return;
      const amt = parseFloat(tots[tots.length-1][1].replace(/,/g,''));
      if (amt>0 && amt<2000) {
        if (!lineCharges[num]) lineCharges[num]={num,total:0,count:0};
        lineCharges[num].total+=amt; lineCharges[num].count++;
      }
      if (/IDD\s*001/i.test(chunk)) {
        const im = chunk.match(/Total\s+for\s+IDD[^\n]*([\d,]+\.\d{2})/i);
        if (im) {
          const ct = chunk.match(/\b(Philippines|Malaysia|India|Indonesia|China|Australia|USA|New Zealand)\b/i);
          iddRows.push({num,amount:parseFloat(im[1].replace(/,/g,'')),country:ct?ct[1]:''});
        }
      }
    });
  }

  if (!totalBill) totalBill = Object.values(lineCharges).reduce((s,r)=>s+r.total,0);
  const iddTotal = iddRows.reduce((s,r)=>s+r.amount,0);
  return {billMonth, totalBill, lineCharges, iddRows, iddTotal, gst};
}

// ── Parse CSV bill ──
function parseCSVBill(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (!lines.length) return { billMonth: '', totalBill: 0, lineCharges: {}, iddRows: [], iddTotal: 0 };
  const delim = lines[0].includes('\t') ? '\t' : ',';
  const headers = lines[0].split(delim).map(h => h.replace(/"/g, '').trim());
  const rows = lines.slice(1).map(line => {
    const cells = line.split(delim).map(c => c.replace(/"/g, '').trim());
    const o = {}; headers.forEach((h, i) => o[h] = cells[i] || ''); return o;
  });
  const k = Object.keys(rows[0] || {});
  const numKey  = k.find(c => /phone|number|tel|mobile|line/i.test(c));
  const amtKey  = k.find(c => /amount|total|charge|cost/i.test(c));
  const typeKey = k.find(c => /type|desc|category/i.test(c));
  const moKey   = k.find(c => /month|period|date/i.test(c));
  const lc = {}, iddRows = []; let billMonth = '', totalBill = 0;
  rows.forEach(r => {
    const num = String(r[numKey] || '').replace(/\D/g, '').slice(-8);
    const amt = parseFloat(String(r[amtKey] || '0').replace(/[^0-9.]/g, '')) || 0;
    const type = String(r[typeKey] || '').toLowerCase();
    if (!billMonth && r[moKey]) billMonth = r[moKey];
    totalBill += amt;
    if (num.length >= 7) {
      if (!lc[num]) lc[num] = { num, total: 0, count: 0 };
      lc[num].total += amt; lc[num].count++;
      if (/idd|international|overseas/i.test(type)) iddRows.push({ num, amount: amt, country: '' });
    }
  });
  return { billMonth, totalBill, lineCharges: lc, iddRows, iddTotal: iddRows.reduce((s, r) => s + r.amount, 0) };
}

// ── Analyse & match ──
// ── Month sort order ──
const MONTH_ORDER = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
function monthSortKey(m) {
  if (!m) return 9999;
  const low = m.toLowerCase();
  for (let i = 0; i < MONTH_ORDER.length; i++) {
    if (low.includes(MONTH_ORDER[i])) {
      const yr = (m.match(/\d{2,4}/) || ['0'])[0];
      const yrNum = yr.length === 2 ? 2000 + parseInt(yr) : parseInt(yr);
      return yrNum * 12 + i;
    }
  }
  return 9999;
}

// ── Analyse multiple bills merged ──
function analyseAll(staffRows, billDataArr) {
  const staffMap = {};
  staffRows.forEach(s => { if (s.num) staffMap[s.num] = s; });

  // Sort bills by month
  billDataArr.sort((a, b) => monthSortKey(a.billMonth) - monthSortKey(b.billMonth));

  // Deduplicate by month (keep last if same month uploaded twice)
  const seen = {}, uniqueBills = [];
  billDataArr.forEach(bd => { const k = bd.billMonth || 'unknown'; seen[k] = bd; });
  billDataArr.forEach(bd => { const k = bd.billMonth || 'unknown'; if (seen[k] === bd) uniqueBills.push(bd); });

  const monthlySummary = uniqueBills.map(bd => {
    // Format month as "Feb-26" style
    const moLabel = bd.billMonth ? bd.billMonth.replace(/(\w+)\s+20(\d{2})/, '$1-$2') : 'Unknown';
    return {
      month: moLabel,
      total: bd.totalBill, sub: bd.totalBill - bd.iddTotal,
      idd: bd.iddTotal, credits: 0, gst: bd.gst || 0,
      lines: Object.keys(bd.lineCharges).length, notes: ''
    };
  });

  // Latest month for KPIs
  const latest = uniqueBills[uniqueBills.length - 1] || billDataArr[0];
  const month = latest?.billMonth || 'Current month';

  // All billing rows across all months
  const allBillingRows = [], allIddRows = [];
  const crossRefMap = {};

  uniqueBills.forEach(bd => {
    const mo = bd.billMonth || '—';
    Object.values(bd.lineCharges).forEach(lc => {
      const st = staffMap[lc.num] || null;
      const row = { month: mo, num: lc.num, name: st?.name || '', dept: st?.dept || '', mgr: st?.mgr || '', loc: st?.loc || '', sub: lc.total, idd: 0, other: 0, total: lc.total, country: '', note: '', matched: !!st };
      allBillingRows.push(row);
      if (!crossRefMap[lc.num]) crossRefMap[lc.num] = { num: lc.num, name: st?.name || '', dept: st?.dept || '', loc: st?.loc || '', status: st ? 'Hire' : 'Pending', months: {}, total: 0, iddTotal: 0, countries: new Set(), flag: st ? 'OK' : 'Pending' };
      crossRefMap[lc.num].months[mo] = (crossRefMap[lc.num].months[mo] || 0) + lc.total;
      crossRefMap[lc.num].total += lc.total;
    });
    bd.iddRows.forEach(r => {
      const st = staffMap[r.num] || null;
      allIddRows.push({ month: mo, num: r.num, name: st?.name || '', dept: st?.dept || '', mgr: st?.mgr || '', country: r.country || '', idd: r.amount, sub: 12, total: r.amount + 12, flag: r.amount > 50 ? 'High IDD' : '' });
      if (crossRefMap[r.num]) { crossRefMap[r.num].iddTotal += r.amount; if (r.country) crossRefMap[r.num].countries.add(r.country); crossRefMap[r.num].flag = 'IDD'; }
    });
  });

  // Cross-ref: convert months map to named columns
  const allMonths = monthlySummary.map(m => m.month);
  const crossRef = Object.values(crossRefMap).sort((a,b) => b.total - a.total).map(r => ({
    ...r, countries: [...r.countries].join('/') || '',
    ...Object.fromEntries(allMonths.map(m => [m, r.months[m] || 0]))
  }));

  // Unmatched lines (latest month)
  const latestEnriched = Object.values(latest?.lineCharges || {}).map(lc => ({ ...lc, matched: !!staffMap[lc.num] }));
  const unmatched = latestEnriched.filter(r => !r.matched);

  // IDD alerts across all months — group by staff, show ALL IDD users
  const iddByStaff = {};
  allIddRows.forEach(r => {
    if (!iddByStaff[r.num]) iddByStaff[r.num] = { num: r.num, name: r.name, dept: r.dept, mgr: r.mgr, total: 0, months: [], countries: new Set() };
    iddByStaff[r.num].total += r.idd;
    if (!iddByStaff[r.num].months.includes(r.month)) iddByStaff[r.num].months.push(r.month);
    if (r.country) iddByStaff[r.num].countries.add(r.country);
  });
  const hrAlerts = [];
  Object.values(iddByStaff).sort((a,b) => b.total - a.total).forEach(r => {
    // All IDD users shown — severity based on amount and recurrence
    let level, status;
    if (r.total > 50) {
      level = 'red'; status = 'High IDD — verify with manager';
    } else if (r.months.length >= 3) {
      level = 'amber'; status = 'Recurring IDD — ' + r.months.length + ' months';
    } else if (r.months.length === 2) {
      level = 'amber'; status = 'IDD in 2 months — monitor';
    } else {
      level = 'navy'; status = 'IDD user — SGD ' + r.total.toFixed(2);
    }
    hrAlerts.push({
      num: r.num, name: r.name || r.num, dept: r.dept,
      iddTotal: r.total,
      countries: [...r.countries].join(' / ') || '—',
      latest: r.months[r.months.length-1],
      mgr: r.mgr || '—',
      status, level
    });
  });
  if (unmatched.length) hrAlerts.push({ num: '—', name: `${unmatched.length} unmatched line(s)`, dept: '—', iddTotal: 0, countries: '—', latest: month, mgr: '—', status: 'Not in Staff Master — update listing', level: 'navy' });
  if (!hrAlerts.length) hrAlerts.push({ num: '—', name: 'No IDD usage detected', dept: 'All clear', iddTotal: 0, countries: '—', latest: month, mgr: '—', status: 'No overseas calls this period', level: 'green' });

  return {
    month, hrAlerts, unmatched, monthlySummary, allMonths,
    totalBill: latest?.totalBill || 0,
    iddTotal: monthlySummary.reduce((s,m) => s + m.idd, 0),
    activeLines: staffRows.filter(s => /active/i.test(s.status) || !s.status).length,
    unmatchedCount: unmatched.length,
    enriched: latestEnriched,
    iddEnriched: allIddRows.filter(r => r.month === month),
    billingRows: allBillingRows,
    iddRows: allIddRows,
    crossRef
  };
}

// ── Extract month label from filename — handles all common formats ──
function monthFromFilename(filename) {
  const f = filename.toLowerCase().replace(/[_\-\s]/g, '');
  const moNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  // Format: 202602, 202603, 202604, 202605 (YYYYMM anywhere in filename)
  const ym = f.match(/20(\d{2})0?(\d{1,2})/);
  if (ym) {
    const yr = ym[1]; // e.g. "26"
    const mo = parseInt(ym[2]); // e.g. 2 for Feb
    if (mo >= 1 && mo <= 12) return moNames[mo-1] + '-' + yr;
  }

  // Format: feb2026, mar26, february2026
  const named = f.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*(20)?(\d{2})/);
  if (named) {
    const moMap = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
    const idx = moMap[named[1].slice(0,3)];
    return moNames[idx] + '-' + named[3];
  }

  return '';
}

// ── New bill (keep staff master) ──
window.handleNewBill = async function(e) {
  const newFiles = Array.from(e.target.files);
  if (!newFiles.length || !S.files.staff) return;
  app.innerHTML = `<div class="spinner"><div class="spin"></div><div style="font-size:13px;color:#64748b">Reading ${newFiles.length} new bill file(s)…</div></div>`;
  try {
    // Parse existing bills from current result
    const existingBills = (S.result?.monthlySummary || []).map(m => ({
      billMonth: m.month, totalBill: m.total, iddTotal: m.idd,
      lineCharges: {}, iddRows: []
    }));
    // Parse new files
    const newBills = [];
    for (const file of newFiles) {
      const buf = await file.arrayBuffer();
      const bd = file.name.toLowerCase().endsWith('.csv')
        ? parseCSVBill(new TextDecoder().decode(buf))
        : parseBillText(await pdfToText(new Uint8Array(buf)));
      const fnMonth = monthFromFilename(file.name);
      if (fnMonth) bd.billMonth = fnMonth;
      newBills.push(bd);
    }
    // Re-process all bills stored + new ones
    S.files.billRaws = [...(S.files.billRaws || []), ...newFiles];
    renderDash(analyseAll(S.files.staff, [...(S._allBillData||[]), ...newBills]), true);
    S._allBillData = [...(S._allBillData||[]), ...newBills];
  } catch(err) { showErr(err.message); }
};

// ── Process both files ──
async function processFiles() {
  app.innerHTML = `<div class="spinner"><div class="spin"></div><div style="font-size:13px;color:#64748b">Reading ${S.files.billRaws.length} bill file(s) and matching to staff…</div></div>`;
  try {
    const sb = await S.files.staffRaw.arrayBuffer();
    const staffRows = parseStaff(new Uint8Array(sb));
    S.files.staff = staffRows;
    const billDataArr = [];
    for (const billFile of S.files.billRaws) {
      const buf = await billFile.arrayBuffer();
      const bd = billFile.name.toLowerCase().endsWith('.csv')
        ? parseCSVBill(new TextDecoder().decode(buf))
        : parseBillText(await pdfToText(new Uint8Array(buf)));
      // Always try filename first — most reliable
      const fnMonth = monthFromFilename(billFile.name);
      if (fnMonth) bd.billMonth = fnMonth;
      billDataArr.push(bd);
    }
    S._allBillData = billDataArr;
    renderDash(analyseAll(staffRows, billDataArr), true);
  } catch(err) { showErr(err.message); }
}

function showErr(msg) {
  app.innerHTML = `<div class="spinner"><div style="font-size:28px;color:#dc2626">&#9888;</div><div style="font-size:13px;color:#64748b;max-width:400px;text-align:center">${msg||'Could not read files.'}</div><button onclick="renderUpload()" style="padding:8px 20px;background:#193e6b;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit">Try again</button></div>`;
}

  </div>`;
  ['staff','bill'].forEach(type => {
    const box = document.getElementById('box-' + type);
    box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drag'); });
    box.addEventListener('dragleave', () => box.classList.remove('drag'));

window.onFile = function(e, type) {
  if (type === 'staff') {
    const f = e.target.files[0]; if (f) markFile(f, type);
  } else {
    const files = Array.from(e.target.files); if (files.length) markBills(files);
  }
};

function markBills(files) {
  S.files.billRaws = files;
  const box = document.getElementById('box-bill');
  const done = document.getElementById('bill-done');
  box.classList.add('done');
  done.textContent = '✓ ' + files.length + ' bill file(s): ' + files.map(f => f.name).join(', ').slice(0, 60) + (files.map(f=>f.name).join(', ').length > 60 ? '…' : '');
  if (S.files.staffRaw && S.files.billRaws.length) document.getElementById('btn-go').classList.add('ready');
}

function markFile(f, type) {
  S.files.staffRaw = f;
  document.getElementById('box-staff').classList.add('done');
  document.getElementById('staff-done').textContent = '✓ ' + f.name;
  if (S.files.staffRaw && S.files.billRaws.length) document.getElementById('btn-go').classList.add('ready');
}
